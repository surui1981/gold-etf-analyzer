<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="reset.page_title">重置密码 · 黄金价格投资辅助工具</title>
<!-- V0.69.0 FOUC 防护：必须在 <head> 第一行、theme.css 之前 -->
<script>(function(){
  try {
    var k="pm_theme_mode", v=localStorage.getItem(k)||"light";
    if(["light","dark","auto","hc"].indexOf(v)<0) v="light";
    var eff=v==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;
    document.documentElement.setAttribute("data-theme",eff);
  } catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();</script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="黄金ETF">
<script src="/static/theme.js" defer></script>
<!-- V0.73.0 i18n FOUC guard -->
<script>(function(){
  try {
    var k="pm_lang", v=localStorage.getItem(k);
    if(v && ["zh-CN","zh-TW","en-US"].indexOf(v)>=0){
      document.documentElement.setAttribute("lang", v);
    }
  } catch(e){}
})();</script>
<script src="/static/i18n.js" defer></script>
<script src="/static/auth.js" defer></script>
<style>
  /* 本页专用样式（登录页的 .card/.alert 等已在 theme.css） */
  .card { max-width: 420px; margin: 0 auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <!-- token 缺失/已用：默认隐藏，JS 校验后再显示（避免闪一下再消失） -->
  <section class="card hidden" id="paneBadToken" role="alert">
    <h1 data-i18n="reset.h_bad_title">链接不可用</h1>
    <p class="sub" data-i18n="reset.h_bad_desc">
      该重置链接已失效（可能已使用或已过期）。请重新申请一次。
    </p>
    <a class="submit" href="/static/login.html" data-i18n="reset.btn_back_login">返回登录页</a>
  </section>

  <section class="card hidden" id="paneForm">
    <h1 data-i18n="reset.h_title">设置新密码</h1>
    <p class="sub" data-i18n="reset.sub">设置成功后，该账号在所有设备上都需要重新登录。</p>
    <form id="resetForm" autocomplete="off" novalidate>
      <label for="newPassword" data-i18n="reset.password">新密码</label>
      <input id="newPassword" name="newPassword" type="password"
             autocomplete="new-password" required minlength="8" maxlength="72">
      <div class="hint" data-i18n="reset.password_ph">至少 8 位，不能是纯数字</div>

      <label for="confirmPassword" style="margin-top:12px" data-i18n="reset.confirm">确认新密码</label>
      <input id="confirmPassword" name="confirmPassword" type="password"
             autocomplete="new-password" required minlength="8" maxlength="72">
      <div class="alert alert-err hidden" id="formErr" role="alert"></div>

      <button type="submit" class="submit" id="submitBtn" data-i18n="reset.btn_submit">
        保存新密码
      </button>
    </form>
    <div class="alert alert-ok hidden" id="formOk" role="status"></div>
    <div class="foot">
      <a href="/static/login.html" data-i18n="reset.btn_back_login">返回登录页</a>
    </div>
  </section>
</main>

<script>
/* reset-password.html 专属层（V0.75.3）。
 *
 * ⚠ 本页**不需要登录态** —— 用户点邮件链接时通常是全新会话，
 * 故 auth.js 的 CSRF 双提交在这里不适用（后端已豁免，见中间件注释）。
 *
 * ⚠ token 从 URL 的 query 取，**用完立刻从地址栏抹掉**
 * （history.replaceState）：否则 token 会留在浏览器历史 / 可能被
 * 复制到别处，也会随 Referer 头泄漏给第三方资源。
 */
window.PM_RESET_PAGE = (function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function t(key, fallback) { return PM_AUTH ? PM_AUTH.t(key, fallback) : fallback; }

  var token = "";
  var submitting = false;

  function readTokenFromUrl() {
    var m = /[?&]token=([^&#]+)/.exec(window.location.search || "");
    return m ? decodeURIComponent(m[1]) : "";
  }

  function show(id) {
    $("paneBadToken").classList.toggle("hidden", id !== "paneBadToken");
    $("paneForm").classList.toggle("hidden", id !== "paneForm");
  }

  function showError(msg) {
    var el = $("formErr");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  function showOk(msg) {
    var el = $("formOk");
    el.textContent = msg;
    el.classList.remove("hidden");
    $("resetForm").classList.add("hidden");
  }

  /** 两次密码不一致 —— 纯前端校验，不发请求（省一次往返）。 */
  function mismatch() {
    return $("newPassword").value !== $("confirmPassword").value;
  }

  function onSubmit(ev) {
    ev.preventDefault();
    if (submitting) { return; }          // 防双击重复提交
    $("formErr").classList.add("hidden");

    if (mismatch()) {
      showError(t("reset.err_mismatch", "两次输入的密码不一致"));
      return;
    }

    submitting = true;
    var btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = t("reset.busy", "处理中…");

    PM_AUTH.apiJson("/api/v1/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: $("newPassword").value }),
    })
      .then(function (data) {
        showOk(
          t("reset.ok", "密码已重置，共 {n} 个会话已失效，请重新登录。")
            .replace("{n}", String(data.sessions_revoked || 0))
        );
        PM_AUTH.track && PM_AUTH.track("password_reset_success");
        // ⚠ 用 LOGIN_PAGE（页面路径）而非 LOGIN_URL（= "/api/v1/auth/login"，
        // 那是 API 端点）—— 两者只差一个词，混用会跳到 404。
        setTimeout(function () {
          window.location.href = PM_AUTH.LOGIN_PAGE || "/static/login.html";
        }, 2600);
      })
      .catch(function (err) {
        submitting = false;
        btn.disabled = false;
        btn.textContent = t("reset.btn_submit", "保存新密码");
        // ⚠ 后端对「不存在 / 已用 / 已过期」返回**同一 code**，前端也**不区分** ——
        // 区分会让攻击者能判断「这个 token 曾经有效」。
        if (err && err.code === "reset_token_invalid") {
          show("paneBadToken");
          return;
        }
        showError(PM_AUTH.errMessage
          ? PM_AUTH.errMessage(err)
          : (err && err.message) || t("reset.err_generic", "重置失败，请稍后重试"));
      });
  }

  function boot() {
    token = readTokenFromUrl();
    if (!token) {
      show("paneBadToken");
      return;
    }
    // ⚠ 立刻把 token 从地址栏抹掉（理由见文件头注释）
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", window.location.pathname);
    }
    show("paneForm");
    $("resetForm").addEventListener("submit", onSubmit);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  return { boot: boot };
})();
</script>
</body>
</html>
