<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="reports.page_title">报告存档 · 黄金 ETF 投资辅助</title>
<!-- V0.69.0 FOUC 防护 -->
<script>(function(){
  try {
    var k="pm_theme_mode", v=localStorage.getItem(k)||"light";
    if(["light","dark","auto","hc"].indexOf(v)<0) v="light";
    var eff=v==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;
    document.documentElement.setAttribute("data-theme",eff);
  } catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();</script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="/static/theme.js" defer></script>
<!-- V0.73.0 i18n FOUC guard -->
<script>(function(){
  try {
    var k="pm_lang", v=localStorage.getItem(k);
    if(v && ["zh-CN","zh-TW","en-US"].indexOf(v)>=0){
      document.documentElement.setAttribute("lang", v);
    }
  } catch(e){}
})();</script>
<script src="/static/i18n/zh-CN.js"></script>
<script src="/static/i18n.js" defer></script>
<!-- V0.75.0：认证客户端（CSRF 头注入 + 会话门禁） -->
<script src="/static/auth.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr 280px; gap: 18px; }
  .layout .main-col { min-width: 0; }
  .layout .stats-col { min-width: 0; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px;
  }
  .toolbar label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .toolbar select, .toolbar input, .toolbar button {
    font-size: 13px; padding: 4px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .toolbar input { cursor: text; }
  .toolbar input[type="search"] { min-width: 180px; }
  .toolbar .spacer { flex: 1; }
  .toolbar .primary {
    background: var(--accent, #1d4ed8); color: #fff; border-color: var(--accent, #1d4ed8);
    font-weight: 600; padding: 5px 14px;
  }
  .toolbar .primary:hover { filter: brightness(1.08); }

  .status-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; }
  .status-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; display: inline-flex; align-items: center; gap: 6px;
  }
  .status-chip .lbl { color: var(--muted); }
  .status-chip .val { font-weight: 600; }

  .rep-list { display: flex; flex-direction: column; gap: 12px; }
  .rep-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; transition: box-shadow .15s, transform .15s; position: relative;
  }
  .rep-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .rep-card .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rep-card .cat {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: #e8eefc; color: #1d4ed8;
  }
  .rep-card .rdate { font-size: 11px; color: var(--muted); }
  .rep-card h3 { font-size: 15px; line-height: 1.5; margin: 6px 0 4px; }
  .rep-card .fname { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .rep-card .summary { font-size: 13px; color: var(--muted); line-height: 1.65; margin-top: 4px; }
  .rep-card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .rep-card .tag-chip {
    font-size: 11px; padding: 1px 8px; background: #ecfdf5; color: #047857;
    border: 1px solid #a7f3d0; border-radius: 999px; cursor: pointer;
  }
  .rep-card .tag-chip:hover { background: #d1fae5; }
  .rep-card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .rep-card .actions {
    position: absolute; top: 10px; right: 10px; display: flex; gap: 6px;
  }
  .rep-card .actions button, .rep-card .actions a {
    font-size: 12px; padding: 3px 9px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .rep-card .actions button:hover, .rep-card .actions a:hover { background: rgba(0,0,0,0.04); }
  .rep-card .actions .view { color: var(--accent, #1d4ed8); }
  .rep-card .actions .del { color: #b91c1c; }
  .rep-card .actions .del:hover { background: #fee2e2; }
  .rep-card .meta-area {
    margin-top: 8px; padding: 10px 12px; background: var(--bg);
    border: 1px dashed var(--border); border-radius: 6px;
  }
  .rep-card .meta-area .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
  }
  .rep-card .meta-area input, .rep-card .meta-area textarea {
    width: 100%; padding: 5px 7px; font-family: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--card); color: var(--text);
  }
  .rep-card .meta-area textarea { min-height: 48px; resize: vertical; }
  .rep-card .meta-area label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .rep-card .meta-area .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .rep-card .meta-area .row button {
    font-size: 12px; padding: 3px 10px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .rep-card .meta-area .row .save {
    background: var(--accent, #1d4ed8); color: #fff; border-color: var(--accent, #1d4ed8);
  }
  /* [hidden] 陷阱：.rep-card .meta-area 设了 padding/background，
     但 display 仍是块级默认，所以这条只需保证不写 display 覆盖即可。
     .actions 用了 position:absolute 不改 display，同样安全。 */
  .rep-card .meta-area[hidden] { display: none; }

  /* 上传区 */
  .upload-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .upload-card .drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-card .drop:hover, .upload-card .drop.over {
    border-color: var(--accent, #1d4ed8); background: rgba(29,78,216,.04);
  }
  .upload-card .drop .ico { font-size: 28px; display: block; margin-bottom: 6px; }
  .upload-card .drop input[type="file"] { display: none; }
  .upload-card .fields {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .upload-card label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .upload-card input, .upload-card textarea {
    width: 100%; padding: 5px 7px; font-family: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text);
  }
  .upload-card textarea { min-height: 44px; resize: vertical; }
  .upload-card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .upload-card .row button {
    font-size: 13px; padding: 5px 14px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .upload-card .row .submit {
    background: var(--accent, #1d4ed8); color: #fff; border-color: var(--accent, #1d4ed8);
    font-weight: 600;
  }
  .upload-card .picked { font-size: 12px; color: var(--text); margin-top: 8px; }
  .upload-card[hidden] { display: none; }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 0; }
  .error-state { text-align: center; padding: 40px 0; color: var(--up, #c92a2a); }

  /* 侧栏统计 */
  .stats-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .stats-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--muted); letter-spacing: .5px; }
  .stats-card .row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 12px; }
  .stats-card .row .name { color: var(--text); }
  .stats-card .row .count { font-weight: 600; color: var(--accent, #1d4ed8); font-variant-numeric: tabular-nums; }
  .stats-card .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
  .stats-card .bar-fill { height: 100%; background: var(--accent, #1d4ed8); transition: width .25s; }
  .stats-card .kpi { font-size: 22px; font-weight: 700; color: var(--accent, #1d4ed8); margin: 2px 0 6px; }

  /* topnav 复用同款（与 central_bank.html / favorites.html 同块） */
  .topnav { position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 8px;
    background: linear-gradient(180deg, #1f2329 0%, #262b33 100%); border-radius: 12px;
    padding: 10px 16px 8px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.18),
      0 1px 0 rgba(255,255,255,.04) inset; }
  .topnav .topnav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topnav .brand { display:inline-flex; align-items:center; gap:8px; font-weight: 700; font-size: 15px;
    color: #f5d97a; letter-spacing: .5px; text-decoration: none; }
  .topnav .brand .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--accent,#806014);
    box-shadow:0 0 8px rgba(245,217,122,.55); }
  .topnav .links { display: flex; gap: 4px; flex-wrap: wrap; }
  .topnav a { display:inline-flex; align-items:center; gap:5px; color: #d6d9dd; text-decoration: none;
    font-size: 13px; padding: 5px 11px; border-radius: 7px; transition: background .15s, color .15s;
    border: 1px solid transparent; }
  .topnav a .nav-ico { font-size:13px; opacity:.85; }
  .topnav a:hover { background: rgba(255,255,255,.10); color: #fff; border-color: rgba(255,255,255,.06); }
  .topnav a.active { background: var(--accent); color: #1f2329; font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .topnav a.active .nav-ico { opacity:1; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div id="topnav-mount"></div>
<div id="subnav-mount"></div>
<main>
<div class="layout">
  <div class="main-col">
    <header>
      <div>
        <h1 data-i18n="reports.h1">📁 报告存档</h1>
        <div class="sub" data-i18n="reports.subtitle">上传 HTML 研报并登记元数据 · 新标签页查看 · 仅供研究参考</div>
      </div>
    </header>

    <div class="status-row" id="statusRow">
      <span class="status-chip">
        <span class="lbl" data-i18n="reports.chip_total">总数</span>
        <span class="val" id="valTotal">--</span>
      </span>
      <span class="status-chip">
        <span class="lbl" data-i18n="reports.chip_30d">30 天新增</span>
        <span class="val" id="val30d">--</span>
      </span>
      <span class="status-chip">
        <span class="lbl" data-i18n="reports.chip_size">占用</span>
        <span class="val" id="valSize">--</span>
      </span>
      <span class="status-chip">
        <span class="lbl" data-i18n="reports.chip_shown">当前显示</span>
        <span class="val" id="valShown">--</span>
      </span>
    </div>

    <div class="upload-card" id="uploadCard" hidden>
      <div class="drop" id="dropZone">
        <span class="ico">📄</span>
        <span data-i18n="reports.drop_hint">点击选择，或把 HTML 文件拖到这里</span>
        <input type="file" id="fileInput" accept=".html,.htm,text/html">
      </div>
      <div class="picked" id="pickedName" hidden></div>
      <div class="fields">
        <div>
          <label for="upTitle" data-i18n="reports.field_title">标题</label>
          <input type="text" id="upTitle" maxlength="200" data-i18n-placeholder="reports.ph_title" placeholder="缺省取文件名">
        </div>
        <div>
          <label for="upDate" data-i18n="reports.field_date">报告日期</label>
          <input type="date" id="upDate">
        </div>
        <div>
          <label for="upCategory" data-i18n="reports.field_category">分类</label>
          <input type="text" id="upCategory" list="categoryOptions" maxlength="32" data-i18n-placeholder="reports.ph_category" placeholder="缺省「其他」">
          <datalist id="categoryOptions"></datalist>
        </div>
        <div>
          <label for="upTags" data-i18n="reports.field_tags">标签</label>
          <input type="text" id="upTags" data-i18n-placeholder="reports.ph_tags" placeholder="逗号分隔，如：黄金, 美联储">
        </div>
      </div>
      <div style="margin-top:8px">
        <label for="upSummary" data-i18n="reports.field_summary">摘要</label>
        <textarea id="upSummary" maxlength="2000" data-i18n-placeholder="reports.ph_summary" placeholder="一句话说明这份报告讲了什么"></textarea>
      </div>
      <div class="row">
        <button type="button" id="btnCancelUpload" data-i18n="reports.btn_cancel">取消</button>
        <button type="button" id="btnUpload" class="submit" data-i18n="reports.btn_upload">上传并存档</button>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="searchInput" data-i18n-placeholder="reports.ph_search" placeholder="搜索标题 / 摘要 / 文件名">
      <label for="catSel" data-i18n="reports.filter_category">分类</label>
      <select id="catSel"><option value="" data-i18n="reports.cat_all">全部</option></select>
      <label for="tagSel" data-i18n="reports.filter_tag">标签</label>
      <select id="tagSel"><option value="" data-i18n="reports.tag_all">全部</option></select>
      <span class="spacer"></span>
      <button type="button" id="btnToggleUpload" class="primary" data-i18n="reports.btn_new">＋ 上传报告</button>
    </div>

    <div id="repList" class="rep-list">
      <div class="empty-state" data-i18n="reports.loading">加载中…</div>
    </div>
  </div>

  <aside class="stats-col">
    <div class="stats-card" id="statsCategory">
      <h3 data-i18n="reports.stats_by_category">按分类</h3>
    </div>
    <div class="stats-card" id="statsKpi">
      <h3 data-i18n="reports.stats_kpi">最近 30 天</h3>
      <div class="kpi" id="kpi30d">--</div>
      <div class="sub" data-i18n="reports.stats_kpi_sub">新增上传数</div>
    </div>
  </aside>
</div>

<footer data-i18n="reports.footer">gold-etf-analyzer · 报告存档 · 报告内容以隔离沙箱渲染</footer>
</main>

<script src="/static/topnav.js" defer></script>
<script src="/static/report-archive.js" defer></script>
<script src="/static/toast.js" defer></script>
<script src="/static/pwa.js" defer></script>
<script src="/static/net-status.js" defer></script>
</body>
</html>
