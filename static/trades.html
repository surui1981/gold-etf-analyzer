<script>(function(){
  try {
    var k="pm_theme_mode", v=localStorage.getItem(k)||"light";
    if(["light","dark","auto","hc"].indexOf(v)<0) v="light";
    var eff=v==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;
    document.documentElement.setAttribute("data-theme",eff);
  } catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();</script>

<style>
  /* V0.69.0：CSS 变量已迁至 /static/theme.css */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }
  /* 顶部导航（与全站一致，置顶） */
  .topnav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: #1f2329; border-radius: 12px; padding: 10px 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .topnav .brand { font-weight: 700; font-size: 15px; color: #f5d97a; letter-spacing: .5px; }
  .topnav .links { display: flex; gap: 6px; flex-wrap: wrap; }
  .topnav a { color: #d6d9dd; text-decoration: none; font-size: 13.5px; padding: 6px 14px; border-radius: 8px; transition: background .15s; }
  .topnav a:hover { background: rgba(255,255,255,.12); color: #fff; }
  .topnav a.active { background: var(--accent); color: #1f2329; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; }
  .hero { margin-bottom: 16px; }
  .hero .tagline { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .notice { display: inline-block; margin-top: 8px; font-size: 11.5px; color: #92400e; background: #fff7e6; border: 1px solid #f0e2b6; border-radius: 6px; padding: 3px 10px; }
  /* 筛选器 */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 12px; color: var(--muted); }
  .fld select, .fld input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 13px; color: var(--text); background: #fff; font-family: inherit; }
  .fld input[type=text] { width: 160px; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--text); border-color: var(--border); font-weight: 400; }
  .btn:hover { filter: brightness(1.05); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chips .cl { font-size: 12px; color: var(--muted); }
  .chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--text); }
  .chip:hover { border-color: var(--accent); background: #fffaf0; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .k-label { font-size: 12px; color: var(--muted); }
  .kpi .k-value { font-size: 20px; font-weight: 700; margin-top: 5px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .k-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .up-txt { color: var(--up); }
  .down-txt { color: var(--down); }
  /* 表格 */
  .tbl-wrap { overflow-x: auto; }
  table.trades { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.trades th, table.trades td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  table.trades th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fafbfc; position: sticky; top: 0; }
  table.trades td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.trades tr:hover td { background: #fcfcfd; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #fff; }
  .tag.buy { background: var(--up); }
  .tag.sell { background: var(--down); }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 4px; line-height: 1.9; }
  /* 分页 */
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .pager button { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12.5px; color: var(--text); }
  .pager button:disabled { opacity: .45; cursor: not-allowed; }
  .acc-hint { font-size: 12px; color: #4b5563; background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; line-height: 1.8; }
  .acc-hint b { color: var(--text); }
</style>

<script>
(function () {
  "use strict";

  var API = "/api/v1/trades";

  var state = { page: 1, pageSize: 50, pageCount: 1, total: 0, loading: false };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtMoney(v) {
    if (v == null) return "—";
    return Number(v).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtQty(v) {
    if (v == null) return "—";
    return Number(v).toLocaleString("zh-CN", { maximumFractionDigits: 4 });
  }
  function fmtTime(s) {
    if (!s) return "—";
    return String(s).replace("T", " ").slice(0, 16);
  }
  function signCls(v) {
    if (v == null || v === 0) return "";
    return v > 0 ? "up-txt" : "down-txt";
  }
  function signText(v) {
    if (v == null) return "—";
    var n = Number(v);
    return (n > 0 ? "+" : "") + fmtMoney(n);
  }

  /* ── URL 组装（含当前账本） ── */
  function buildQuery(withPage) {
    var parts = [];
    var acc = Acc.currentId();
    if (acc) parts.push("account_id=" + encodeURIComponent(acc));
    var side = $("fSide").value;
    if (side) parts.push("side=" + side);
    var start = $("fStart").value;
    if (start) parts.push("start=" + start);
    var end = $("fEnd").value;
    if (end) parts.push("end=" + end);
    var pos = $("fPosition").value;
    if (pos) parts.push("position_id=" + pos);
    var kw = $("fKeyword").value.trim();
    if (kw) parts.push("keyword=" + encodeURIComponent(kw));
    if (withPage) {
      parts.push("page=" + state.page);
      parts.push("page_size=" + state.pageSize);
    }
    return parts.length ? ("?" + parts.join("&")) : "";
  }

  /* ── 加载汇总 + 明细 ── */
  function load() {
    if (state.loading) return;
    state.loading = true;
    var url = API + buildQuery(true);
    $("listInfo").textContent = "（查询中…）";
    fetch(url, { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        state.page = d.page; state.pageCount = d.page_count;
        state.total = d.total; state.pageSize = d.page_size;
        renderSummary(d.summary);
        renderTable(d.items);
        $("pageInfo").textContent = "第 " + (d.page ?? 1) + " / " + (d.page_count ?? 1) + " 页 · 共 " + (d.total ?? 0) + " 笔";
        $("listInfo").textContent = "（筛选结果 " + (d.total ?? 0) + " 笔）";
        $("btnPrev").disabled = d.page <= 1;
        $("btnNext").disabled = d.page >= d.page_count;
        renderAccHint();
      })
      .catch(function (e) {
        $("tbody").innerHTML = '<tr><td colspan="11" class="empty">加载失败：' + esc(e.message) +
          '<br>请确认服务已启动（127.0.0.1:8888）后重试。</td></tr>';
        $("listInfo").textContent = "";
      })
      .then(function () { state.loading = false; });
  }

  function renderSummary(s) {
    var pnlCls = signCls(s.realized_pnl);
    var netCls = (s.net_amount ?? 0) > 0 ? "" : "";
    var cards = [
      { label: "成交笔数", value: (s.count ?? 0) + " 笔", sub: "买入 " + (s.buy_count ?? 0) + " / 卖出 " + (s.sell_count ?? 0) },
      { label: "买入金额", value: "¥" + fmtMoney(s.buy_amount), sub: "不含手续费" },
      { label: "卖出金额", value: "¥" + fmtMoney(s.sell_amount), sub: "不含手续费" },
      { label: "净流出", value: "¥" + fmtMoney(s.net_amount), sub: "买入 − 卖出", cls: netCls },
      { label: "手续费合计", value: "¥" + fmtMoney(s.total_fee), sub: "所有成交" },
      { label: "已实现盈亏", value: signText(s.realized_pnl), sub: "均价法，已扣卖出手续费", cls: pnlCls }
    ];
    $("kpiArea").innerHTML = cards.map(function (c) {
      return '<div class="kpi"><div class="k-label">' + esc(c.label) + '</div>' +
        '<div class="k-value ' + (c.cls || "") + '">' + esc(c.value) + '</div>' +
        '<div class="k-sub">' + esc(c.sub) + '</div></div>';
    }).join("");
  }

  function renderTable(items) {
    if (!items || !items.length) {
      $("tbody").innerHTML = '<tr><td colspan="11" class="empty">' +
        '当前筛选条件下没有成交记录。<br>可在「持仓与决策」页通过加仓 / 减仓录入交易，' +
        '或放宽筛选条件（如把日期区间清空、切到「全部账本」）后重试。</td></tr>';
      return;
    }
    $("tbody").innerHTML = items.map(function (i) {
      var tag = i.side === "buy"
        ? '<span class="tag buy">买入</span>'
        : '<span class="tag sell">卖出</span>';
      return "<tr>" +
        "<td>" + esc(fmtTime(i.traded_at)) + "</td>" +
        "<td>" + esc(i.account_name) + "</td>" +
        "<td>" + esc(i.name) + " <span style='color:var(--muted)'>" + esc(i.symbol) + "</span></td>" +
        "<td>" + tag + "</td>" +
        '<td class="num">' + esc(fmtQty(i.quantity)) + "</td>" +
        '<td class="num">' + esc(fmtMoney(i.price)) + "</td>" +
        '<td class="num">' + esc(fmtMoney(i.amount)) + "</td>" +
        '<td class="num">' + esc(fmtMoney(i.fee)) + "</td>" +
        '<td class="num ' + signCls(i.realized_pnl) + '">' + esc(signText(i.realized_pnl)) + "</td>" +
        '<td class="num">' + esc(fmtQty(i.post_quantity)) + "</td>" +
        '<td><a href="/portfolio" style="color:var(--accent);text-decoration:none">#' + esc(i.position_id) + "</a></td>" +
        "</tr>";
    }).join("");
  }

  /* ── 持仓下拉（跟随账本） ── */
  function loadPositions() {
    var url = Acc.url("/api/v1/positions");
    return fetch(url, { headers: { Accept: "application/json" } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        var cur = $("fPosition").value;
        var opts = ['<option value="">全部持仓</option>'];
        (list || []).forEach(function (p) {
          opts.push('<option value="' + p.id + '">#' + p.id + " " + esc(p.name) +
            "（" + fmtQty(p.quantity) + " 份）</option>");
        });
        $("fPosition").innerHTML = opts.join("");
        $("fPosition").value = cur;
      })
      .catch(function () { /* 忽略：持仓列表失败不影响查询 */ });
  }

  function renderAccHint() {
    var isAll = Acc.isAll();
    var name = isAll ? "全部账本（合并视图）" : Acc.accountName(Acc.currentId());
    $("accHint").innerHTML = "账本：<b>" + esc(name) + "</b>（右上角可切换；" +
      (isAll
        ? "合并视图会汇总所有账本的成交）"
        : "开仓 / 加仓将记入账本 <b>" + esc(Acc.accountName(Acc.targetAccountId())) + "</b>）");
  }

  /* ── 快捷区间 ── */
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function isoDaysAgo(days) {
    var d = new Date();
    d.setDate(d.getDate() - days);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function today() { return isoDaysAgo(0); }

  function bindRangeChips() {
    var chips = document.querySelectorAll(".chips .chip");
    Array.prototype.forEach.call(chips, function (c) {
      c.addEventListener("click", function () {
        Array.prototype.forEach.call(chips, function (x) { x.classList.remove("active"); });
        c.classList.add("active");
        var days = c.getAttribute("data-days");
        if (days) {
          $("fStart").value = isoDaysAgo(Number(days));
          $("fEnd").value = today();
        } else {
          $("fStart").value = "";
          $("fEnd").value = "";
        }
        state.page = 1;
        load();
      });
    });
  }

  /* ── 事件绑定 ── */
  function bind() {
    $("btnQuery").addEventListener("click", function () { state.page = 1; load(); });
    $("btnReset").addEventListener("click", function () {
      $("fSide").value = "";
      $("fStart").value = "";
      $("fEnd").value = "";
      $("fPosition").value = "";
      $("fKeyword").value = "";
      $("fSize").value = "50";
      state.pageSize = 50;
      state.page = 1;
      var chips = document.querySelectorAll(".chips .chip");
      Array.prototype.forEach.call(chips, function (x, idx) {
        x.classList.toggle("active", idx === chips.length - 1);
      });
      load();
    });
    $("fSize").addEventListener("change", function () {
      state.pageSize = Number($("fSize").value) || 50;
      state.page = 1;
      load();
    });
    $("fKeyword").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { state.page = 1; load(); }
    });
    $("fSide").addEventListener("change", function () { state.page = 1; load(); });
    $("fPosition").addEventListener("change", function () { state.page = 1; load(); });
    $("fStart").addEventListener("change", function () { state.page = 1; load(); });
    $("fEnd").addEventListener("change", function () { state.page = 1; load(); });
    $("btnPrev").addEventListener("click", function () {
      if (state.page > 1) { state.page -= 1; load(); }
    });
    $("btnNext").addEventListener("click", function () {
      if (state.page < state.pageCount) { state.page += 1; load(); }
    });
    $("btnExport").addEventListener("click", function () {
      window.location.href = API + "/export" + buildQuery(false);
    });

    // 账本切换 → 重新加载（持仓下拉与明细一起刷新）
    document.addEventListener("account-changed", function () {
      state.page = 1;
      loadPositions().then(load);
    });
  }

  /* ── 启动 ── */
  bindRangeChips();
  bind();
  if (window.Acc) {
    Acc.onReady(function () {
      renderAccHint();
      loadPositions().then(load);
    });
  } else {
    load();
  }

  if (window.FreshnessBar && typeof window.FreshnessBar.load === "function") {
    window.FreshnessBar.load();
  }
})();
</script>
