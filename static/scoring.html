<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="scoring.title">历史打分数据汇总 · 黄金ETF</title>
<!-- V0.69.0 FOUC 防护 -->
<script>(function(){
  try {
    var k="pm_theme_mode", v=localStorage.getItem(k)||"light";
    if(["light","dark","auto","hc"].indexOf(v)<0) v="light";
    var eff=v==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;
    document.documentElement.setAttribute("data-theme",eff);
  } catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();</script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" data-i18n="nav.scoring" content="打分汇总">
<script src="/static/theme.js" defer></script>
<!-- V0.73.0 i18n FOUC guard -->
<script>(function(){
  try {
    var k="pm_lang", v=localStorage.getItem(k);
    if(v && ["zh-CN","zh-TW","en-US"].indexOf(v)>=0){
      document.documentElement.setAttribute("lang", v);
    }
  } catch(e){}
})();</script>
<script src="/static/i18n/zh-CN.js"></script>
<script src="/static/i18n.js" defer></script>
<!-- V0.75.0：认证客户端 -->
<script src="/static/auth.js" defer></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  .wrap { max-width:1200px; margin:0 auto; }
  .toolbar { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .toolbar label { font-size:12px; color:var(--muted); margin-right:6px; }
  .toolbar input, .toolbar select { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--bg); color:var(--text); }
  .toolbar button { padding:6px 14px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px; }
  .toolbar button:hover { background:var(--accent-hover); }
  .tab-bar { display:flex; border-bottom:2px solid var(--border); margin-bottom:14px; }
  .tab { padding:10px 18px; cursor:pointer; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 22px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .card .desc { font-size:11px; color:var(--muted); margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--border); }
  th { font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  /* 日历视图 */
  .cal-month { margin-bottom:18px; }
  .cal-month-title { font-size:13px; font-weight:600; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .cal-cell { aspect-ratio:1; padding:4px; border-radius:4px; font-size:10px; color:#fff; text-align:center; position:relative; min-height:32px; }
  .cal-cell.empty { background:transparent; }
  .cal-cell .cal-day { font-size:11px; font-weight:600; }
  .cal-cell .cal-trend { font-size:9px; opacity:0.85; }
  /* index level colors */
  .cal-cell.lv-strong_bullish { background:#16a34a; }
  .cal-cell.lv-bullish { background:#65a30d; }
  .cal-cell.lv-neutral { background:#737373; }
  .cal-cell.lv-bearish { background:#dc2626; }
  .cal-cell.lv-strong_bearish { background:#991b1b; }
  .cal-cell.lv-missing { background:#d4d4d8; color:#52525b; }
  /* 标签 chip */
  .tag-chip { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:var(--bg); border:1px solid var(--border); margin:2px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { padding:32px; text-align:center; color:var(--muted); font-size:13px; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
  .stat { padding:10px 12px; background:var(--bg); border-radius:6px; }
  .stat .v { font-size:18px; font-weight:600; }
  .stat .l { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div id="topnav-mount"></div>
  <h1 style="font-size:20px; margin:18px 0 12px;" data-i18n="scoring.title">历史打分数据汇总</h1>

  <div class="toolbar">
    <div>
      <label data-i18n="scoring.data_range">数据范围</label>
      <input type="date" id="fromDate" value="">
      <span style="color:var(--muted);">~</span>
      <input type="date" id="toDate" value="">
    </div>
    <div>
      <label data-i18n="scoring.tag_filter">依据标签筛选</label>
      <select id="tagFilter"><option value="" data-i18n="scoring.tag_filter_all">全部</option></select>
    </div>
    <div>
      <label>group_by</label>
      <select id="groupBy">
        <option value="day">day</option>
        <option value="week">week</option>
        <option value="month" selected>month</option>
      </select>
    </div>
    <div>
      <label>horizon</label>
      <select id="horizon">
        <option value="t1">T+1</option>
        <option value="t3">T+3</option>
        <option value="t5" selected>T+5</option>
      </select>
    </div>
    <button id="refreshBtn" data-i18n="report.btn_generate">生成报告</button>
  </div>

  <div class="tab-bar">
    <div class="tab active" data-tab="table" data-i18n="scoring.tab_table">表格视图</div>
    <div class="tab" data-tab="calendar" data-i18n="scoring.tab_calendar">日历视图</div>
  </div>

  <div class="tab-panel active" id="panel-table">
    <!-- 段 1: 4 指数时序（按 group_by 聚合）-->
    <div class="card">
      <h2 data-i18n="scoring.section_index">4 指数时序</h2>
      <div class="desc" data-i18n="scoring.trend_index_mean">综合指数均值</div>
      <div id="summaryTable"></div>
    </div>
    <!-- 段 2: 依据标签频次 -->
    <div class="card">
      <h2 data-i18n="scoring.section_tag">依据标签频次</h2>
      <div class="desc" data-i18n="scoring.tag_count">出现次数</div>
      <div id="tagTable"></div>
    </div>
    <!-- 段 3: 命中率（按 horizon） -->
    <div class="card">
      <h2 data-i18n="scoring.section_hit">命中率分析</h2>
      <div class="desc" id="hitDesc">—</div>
      <div id="hitStats"></div>
    </div>
  </div>

  <div class="tab-panel" id="panel-calendar">
    <div class="card">
      <h2 data-i18n="scoring.tab_calendar">日历视图</h2>
      <div class="desc" data-i18n="scoring.data_source_pct">数据源占比</div>
      <div id="calendarView"></div>
    </div>
  </div>
</div>

<script src="/static/topnav.js" defer></script>
<script src="/static/i18n.js" defer></script>
<script src="/static/scoring.js" defer></script>
</body>
</html>
