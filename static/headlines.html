<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="headlines.page_title">今日要闻 · 黄金 ETF 投资辅助工具</title>
<!-- V0.69.0 FOUC 防护：必须在 <head> 第一行、theme.css 之前（同步执行） -->
<script>(function(){
  try {
    var k="pm_theme_mode", v=localStorage.getItem(k)||"light";
    if(["light","dark","auto","hc"].indexOf(v)<0) v="light";
    var eff=v==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):v;
    document.documentElement.setAttribute("data-theme",eff);
  } catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();</script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="黄金ETF">
<script src="/static/theme.js" defer></script>
<!-- V0.73.0 i18n FOUC guard -->
<script>(function(){
  try {
    var k="pm_lang", v=localStorage.getItem(k);
    if(v && ["zh-CN","zh-TW","en-US"].indexOf(v)>=0){
      document.documentElement.setAttribute("lang", v);
    }
  } catch(e){}
})();</script>
<script src="/static/i18n/zh-CN.js"></script>
<script src="/static/i18n.js" defer></script>
<!-- V0.75.0：认证客户端（CSRF 头注入 + 会话门禁 + 顶栏账号菜单） -->
<script src="/static/auth.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px;
  }
  .toolbar label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .toolbar select, .toolbar button {
    font-size: 13px; padding: 4px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .toolbar .range-btns { display: inline-flex; gap: 4px; }
  .toolbar .range-btns button.active {
    background: var(--accent, #1d4ed8); color: #fff; border-color: var(--accent, #1d4ed8);
  }
  .toolbar .spacer { flex: 1; }
  .toolbar .refresh-btn { background: transparent; }
  .toolbar .refresh-btn:hover { background: rgba(0,0,0,.04); }
  .toolbar .refresh-btn.refreshing { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .status-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; }
  .status-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; display: inline-flex; align-items: center; gap: 6px;
  }
  .status-chip .lbl { color: var(--muted); }
  .status-chip .val { font-weight: 600; }
  .status-chip.warn { background: #fff8e6; border-color: #f5d77a; }
  .status-chip.warn .val { color: #b35309; }
  .status-chip.bad { background: #ffe9e9; border-color: #ffc9c9; }
  .status-chip.bad .val { color: #c92a2a; }

  .news-list { display: flex; flex-direction: column; gap: 12px; }
  .news-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; transition: box-shadow .15s, transform .15s;
  }
  .news-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .news-card .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .news-card .site {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: #e8eefc; color: #1d4ed8;
  }
  .news-card .time { font-size: 11px; color: var(--muted); }
  .news-card h3 { font-size: 15px; line-height: 1.5; margin: 6px 0 6px; }
  .news-card h3 a {
    color: var(--text); text-decoration: none; border-bottom: 1px solid transparent;
  }
  .news-card h3 a:hover { border-bottom-color: var(--accent, #1d4ed8); }
  .news-card .summary { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .news-card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .day-group { margin-bottom: 22px; }
  .day-group .day-label {
    font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1px;
    margin-bottom: 8px; padding-left: 4px;
  }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 0; }
  .empty-state.warn { color: #b35309; }
  .error-state { text-align: center; padding: 40px 0; color: var(--up, #c92a2a); }

  /* 顶部导航（统一，置顶）· V0.83 C3：双行布局（白银页蓝色调覆写） */
  .topnav { position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 8px;
    background: linear-gradient(180deg, #1f2329 0%, #262b33 100%); border-radius: 12px;
    padding: 10px 16px 8px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.18),
      0 1px 0 rgba(255,255,255,.04) inset; }
  .topnav .topnav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topnav .brand { display:inline-flex; align-items:center; gap:8px; font-weight: 700; font-size: 15px;
    color: #93c5fd; letter-spacing: .5px; text-decoration: none; }
  .topnav .brand .brand-dot { width:8px; height:8px; border-radius:50%; background:#1d4ed8;
    box-shadow:0 0 8px rgba(147,197,253,.55); }
  .topnav .links { display: flex; gap: 4px; flex-wrap: wrap; }
  .topnav a { display:inline-flex; align-items:center; gap:5px; color: #d6d9dd; text-decoration: none;
    font-size: 13px; padding: 5px 11px; border-radius: 7px; transition: background .15s, color .15s;
    border: 1px solid transparent; }
  .topnav a .nav-ico { font-size:13px; opacity:.85; }
  .topnav a:hover { background: rgba(255,255,255,.10); color: #fff; border-color: rgba(255,255,255,.06); }
  .topnav a.active { background: #1d4ed8; color: #fff; font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .topnav a.active .nav-ico { opacity:1; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div id="topnav-mount"></div>
<div id="subnav-mount"></div>
<main>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="headlines.h1">📰 今日要闻</h1>
      <div class="sub" data-i18n="headlines.subtitle">readhub 财经新闻流 · 每 6 小时自动刷新 · 仅供研究参考</div>
    </div>
  </header>

  <div class="status-row" id="statusRow">
    <span class="status-chip" id="chipLastRefresh">
      <span class="lbl" data-i18n="headlines.chip_last_refresh">上次刷新</span>
      <span class="val" id="valLastRefresh">--</span>
    </span>
    <span class="status-chip" id="chipTotal">
      <span class="lbl" data-i18n="headlines.chip_total">总条数</span>
      <span class="val" id="valTotal">--</span>
    </span>
    <span class="status-chip" id="chip24h">
      <span class="lbl" data-i18n="headlines.chip_24h">24h 新增</span>
      <span class="val" id="val24h">--</span>
    </span>
  </div>

  <div class="toolbar">
    <label data-i18n="headlines.filter_range">时间</label>
    <span class="range-btns" id="rangeBtns">
      <button type="button" data-days="1" data-i18n="headlines.range_today">今日</button>
      <button type="button" data-days="7" class="active" data-i18n="headlines.range_7d">7 天</button>
      <button type="button" data-days="30" data-i18n="headlines.range_30d">30 天</button>
    </span>
    <label for="siteSel" data-i18n="headlines.filter_site">来源</label>
    <select id="siteSel"><option value="" data-i18n="headlines.site_all">全部</option></select>
    <label for="langSel" data-i18n="headlines.filter_lang">语种</label>
    <select id="langSel"><option value="" data-i18n="headlines.lang_all">全部</option></select>
    <span class="spacer"></span>
    <button type="button" class="refresh-btn" id="refreshBtn" title="手动刷新" data-i18n-title="headlines.btn_refresh_title">🔄</button>
  </div>

  <div id="newsList" class="news-list">
    <div class="empty-state" data-i18n="headlines.loading">加载中…</div>
  </div>

  <footer data-i18n="headlines.footer">gold-etf-analyzer · 今日要闻 · 数据源 readhub</footer>
</div>
</main>

<script src="/static/topnav.js" defer></script>
<!-- V0.102 · 今日要闻：headlines.html + headlines.js 拆分（与 silver.html 模式一致） -->
<script src="/static/headlines.js" defer></script>
<script src="/static/toast.js" defer></script>
<script src="/static/pwa.js" defer></script>
<script src="/static/net-status.js" defer></script>
</body>
</html>
