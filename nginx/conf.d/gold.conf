# V0.72.0 P3-b：gold.example.com 反代 + HTTPS + 静态资产直出
# ────────────────────────────────────────────────────────────────
# 端口：
#   80  → ACME 挑战 + 301 → 443
#   443 → TLS 1.2/1.3 + HSTS + 静态 / 反代 /api / 反代 /
#
# 注意：必须先在 .env.prod 设置 DOMAIN；本配置用占位符 gold.example.com 演示

upstream gold_app {
    server app:8888;
    keepalive 32;
}

# 80 端口：ACME 挑战 + 强制 HTTPS
server {
    listen 80;
    server_name gold.example.com;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：HTTPS + 反代
server {
    listen 443 ssl http2;
    server_name gold.example.com;

    # TLS 证书（Certbot 签发后存在这里）
    ssl_certificate     /etc/letsencrypt/live/gold.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gold.example.com/privkey.pem;

    # TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # 根路径：FastAPI 重定向到 /portfolio
    location = / {
        proxy_pass http://gold_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 静态资产：nginx 直出（7 天浏览器缓存 + immutable）
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;  # 静态资产不打 access log
    }

    # Service Worker：必须 root scope，每次校验
    location = /sw.js {
        alias /usr/share/nginx/html/static/sw.js;
        add_header Service-Worker-Allowed / always;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # PWA manifest / icons
    location = /manifest.json {
        alias /usr/share/nginx/html/static/manifest.json;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # /api 反代到 FastAPI
    location /api/ {
        proxy_pass http://gold_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # /portfolio / 等 SPA 页面：反代到 FastAPI（FastAPI 决定 200/404）
    location / {
        proxy_pass http://gold_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
